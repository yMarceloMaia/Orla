query($from: DateTime!, $to: DateTime!, $cursor: String, $overview: Boolean!, $exclude: Boolean!, $orgId: ID, $reviewsQuery: String!, $authoredQuery: String!) {
  viewer @include(if: $overview) {
    login
    excluded: contributionsCollection(from: $from, to: $to, organizationID: $orgId) @include(if: $exclude) {
      contributionCalendar { weeks { contributionDays { date contributionCount } } }
    }
    contributionsCollection(from: $from, to: $to) {
      contributionCalendar {
        totalContributions
        weeks { contributionDays { date weekday contributionCount contributionLevel } }
      }
    }
  }
  reviews: search(query: $reviewsQuery, type: ISSUE, first: 20) @include(if: $overview) {
    issueCount
    nodes { ...pr }
  }
  authored: search(query: $authoredQuery, type: ISSUE, first: 50, after: $cursor) {
    issueCount
    pageInfo { hasNextPage endCursor }
    nodes { ...pr ... on PullRequest { mergeable totalCommentsCount createdAt } }
  }
}
fragment pr on PullRequest {
  title url number headRefName baseRefName repository { nameWithOwner }
  commits(last: 1) { nodes { commit { statusCheckRollup { state } } } }
}
